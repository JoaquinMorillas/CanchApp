services:
  postgres:
    image: postgres:16
    container_name: canchapp-db
    restart: always
    environment:
      - POSTGRES_DB=canchapp_db
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - TZ=America/Argentina/Buenos_Aires
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canchapp -d canchapp_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    
  backend:
    build: ./backend
    container_name: canchapp-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_MAIL_PORT: ${MAIL_PORT}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${MAIL_AUTH}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_STARTTLS_ENABLE}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: ${MAIL_STARTTLS_REQUIRED}
      SPRING_MAIL_PROTOCOL: ${MAIL_PROTOCOL}
      FRONTEND_URL: ${FRONTEND_URL}

  frontend:
    build: 
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: canchapp-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pg_data: